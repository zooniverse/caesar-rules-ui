<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caesar Rules Generator</title>
  <style>
    :root {
      --primary: #008080;
      --primary-dark: #005d69;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #222; color: #ddd; font-family: system-ui, sans-serif; }
    body > * { margin: 10px; }
    h2, h3, p { padding: 10px 0; }
    input, select { padding: 5px 10px; margin-right: 10px; }
    .button {
      background: var(--primary); display: inline-block;
      padding: 0.25em 0.5em; border-radius: 2px; cursor: pointer;
    }
    .button:hover { background: var(--primary-dark); }
    .border { padding: 20px; border: 1px solid #999; }
    .const, .lookup {
      padding: 5px 0; display: flex; align-items: center;
    }
    .const input, .lookup input, .const .button, .lookup .button { margin-left: 10px; }
    .flex { display: flex; align-items: center; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="caesar-rules.js"></script>
</body>
</html>
